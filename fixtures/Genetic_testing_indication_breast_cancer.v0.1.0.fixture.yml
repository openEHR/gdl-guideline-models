      "1":
        gt0004|Age at diagnosis: 45,a
        gt0006|Breast cancer: local::at0020|Yes|
        gt0007|Number of breast cancer cases in first or second degree relatives: 1,1
        gt0022|Bilateral breast cancer: local::at0021|No|
        "gt0023|In bilateral breast cancer, at least one diagnosis occurred before age 50": local::at0023|No|
        "gt0024|History of ovarian or fallopian cancer, early prostate cancer (before age 65) or pancreatic cancer in first or second degree relative (relevant in Bilateral case)": local::at0025|No|
    expected_output:
      "1":
        gt0013|Indication for genetic testing: local::at0014|Genetic testing recommended|
