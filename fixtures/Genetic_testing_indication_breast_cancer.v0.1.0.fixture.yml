guidelines:
  "1": Genetic_testing_indication_breast_cancer.v0.1.0
test_cases:
  - id: 1. No input (negative test) - default action
    input:
      "1": {}
    expected_output:
      "1":
        gt0013|Indication for genetic testing: local::at0015|Genetic testing not recommended|
  - id: 2. Rule Breast cancer ≤40 years
    input:
      "1":
        gt0004|Age at diagnosis: 40,a
        gt0006|Breast cancer: local::at0020|Yes|
    expected_output:
      "1":
        gt0013|Indication for genetic testing: local::at0014|Genetic testing recommended|
