guidelines:
  "1": Infusion_amount_calculation.v0.0.1-draft
test_cases:
  - id: 1. No input (negative test)
    input:
      "1": {}
    expected_output:
      "1": {}
  - id: 2. Drop rate missing (negative test)
    input:
      "1":
        gt0003|Drop time: 7,h
    expected_output:
      "1": {}
  - id: 3. Drop time missing (negative test)
    input:
      "1":
        gt0004|Drop rate: 30,drops/min
    expected_output:
      "1": {}
  - id: 4. Negative input drop rate (negative test)
    input:
      "1":
        gt0003|Drop time: 2,h
        gt0004|Drop rate: -10,drops/min
    expected_output:
      "1": {}
  - id: 5. Negative input drop time  (negative test)
    input:
      "1":
        gt0003|Drop time: -4,h
        gt0004|Drop rate: 40,drops/min
    expected_output:
      "1": {}
  - id: 6. Calculating infusion amount test 1
    input:
      "1":
        gt0003|Drop time: 7,h
        gt0004|Drop rate: 30,drops/min
    expected_output:
      "1":
        gt0006|Infusion amount: 0.630,l
  - id: 7. Calculating infusion amount test 2
    input:
      "1":
        gt0003|Drop time: 5,h
        gt0004|Drop rate: 80,drops/min
    expected_output:
      "1":
        gt0006|Infusion amount: 1.200,l
