guidelines:
  "1": Infusion_time.v0.1.0
test_cases:
  - id: 1. No input (negative test)
    input:
      "1": {}
    expected_output:
      "1": {}
  - id: 2. Rate input missing (negative test)
    input:
      "1":
        gt0003|Infusion volume: 1,l
    expected_output:
      "1": {}
  - id: 3. Volume input missing (negative test)
    input:
      "1":
        gt0010|Drop rate: 2,[drp]/min
    expected_output:
      "1": {}
  - id: 4. Volume 1l, rate 30
    input:
      "1":
        gt0003|Infusion volume: 1,l
        gt0010|Drop rate: 30,[drp]/min
    expected_output:
      "1":
        gt0011|infusion time: 11.0,h
  - id: 5. Volume 5l, rate 50
    input:
      "1":
        gt0003|Infusion volume: 5,l
        gt0010|Drop rate: 50,[drp]/min
    expected_output:
      "1":
        gt0011|infusion time: 33.3,h
  - id: 6. Volume 1l, rate 1
    input:
      "1":
        gt0003|Infusion volume: 1,l
        gt0010|Drop rate: 1,[drp]/min
    expected_output:
      "1":
        gt0011|infusion time: 333.3,h
  - id: 7. Volume 500 ml, rate 30
    input:
      "1":
        gt0003|Infusion volume: 500,ml
        gt0010|Drop rate: 30,[drp]/min
    expected_output:
      "1":
        gt0011|infusion time: 5.6,h
