    input:
      "1":
        gt0003|Class: local::at0007|Any ocular muscle weakness. All other muscle
          strength is normal.|
    expected_output:
      "1":
        gt0006|MGFA Clinical Classification: local::at0019|Class I|
        gt0007|Description: local::at0028|Any ocular muscle weakness. May have weakness
