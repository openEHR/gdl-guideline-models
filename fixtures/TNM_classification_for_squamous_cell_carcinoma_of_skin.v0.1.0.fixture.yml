    input:
      "1":
        gt0032|N - Lymph nodes: local::at0018|N0 - No regional lymph node metastasis|
        gt0033|M - Distant metastasis: local::at0023|M0 - No distant metastasis|
    expected_output:
      "1":
        gt0035|Stage group: local::at0058|Stage cannot be assigned|
