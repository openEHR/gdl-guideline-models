guidelines:
  "1": ovarian_adjuvant_chemotherapy_early_stage.v0.1.0
test_cases:
  - id: 1. No input (negative test, default action)
    input:
      "1": {}
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0028|Adjuvant chemotherapy cannot be
          determined based on available inputs|
  - id: 2. Histology / differentiation grade input missing (negative test, default
      action)
    input:
      "1":
        gt0004|FIGO stage: local::at0017|IA-C|
        gt0005|Lymph node dissection status: local::at0021|Lymph node dissection not performed|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0028|Adjuvant chemotherapy cannot be
          determined based on available inputs|
  - id: 3. FIGO stage input missing (negative test, default action)
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0007|High-grade serous (HGS)|
        gt0005|Lymph node dissection status: local::at0021|Lymph node dissection not performed|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0028|Adjuvant chemotherapy cannot be
          determined based on available inputs|
  - id: 4. Lymph node dissection status input missing (negative test, default
      action)
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0007|High-grade serous (HGS)|
        gt0004|FIGO stage: local::at0016|IA-B|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0028|Adjuvant chemotherapy cannot be
          determined based on available inputs|
  - id: 5. All inputs - 1) Carboplatin monotherapy - IA-C, dissection indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0007|High-grade serous (HGS)|
        gt0004|FIGO stage: local::at0017|IA-C|
        gt0005|Lymph node dissection status: local::at0020|Lymph node dissection indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0024|Carboplatin monotherapy (AUC
          6), every 3 weeks for 6 cycles|
  - id: 6. All inputs - 2) Carboplatin monotherapy - IC, dissection not indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0013|Low-grade serous (LGS)|
        gt0004|FIGO stage: local::at0018|IC|
        gt0005|Lymph node dissection status: local::at0022|Lymph node dissection not indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0024|Carboplatin monotherapy (AUC
          6), every 3 weeks for 6 cycles|
  - id: 7. All inputs - 3) Carboplatin monotherapy - IC, dissection indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0009|Endometrioid – FIGO grade 2|
        gt0004|FIGO stage: local::at0018|IC|
        gt0005|Lymph node dissection status: local::at0020|Lymph node dissection indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0024|Carboplatin monotherapy (AUC
          6), every 3 weeks for 6 cycles|
  - id: 8. All inputs - 1) No adjuvant chemotherapy recommended - IA-B, dissection
      not indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0008|Endometrioid - FIGO grade 1|
        gt0004|FIGO stage: local::at0016|IA-B|
        gt0005|Lymph node dissection status: local::at0022|Lymph node dissection not indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0027|No adjuvant chemotherapy recommended|
  - id: 9. All inputs - 2) No adjuvant chemotherapy recommended - IA-B, dissection
      indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0009|Endometrioid – FIGO grade 2|
        gt0004|FIGO stage: local::at0016|IA-B|
        gt0005|Lymph node dissection status: local::at0020|Lymph node dissection indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0027|No adjuvant chemotherapy recommended|
  - id: 10. All inputs - 3) No adjuvant chemotherapy recommended - IA-C, dissection
      not indicated
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0012|Mucinous|
        gt0004|FIGO stage: local::at0017|IA-C|
        gt0005|Lymph node dissection status: local::at0022|Lymph node dissection not indicated|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0027|No adjuvant chemotherapy recommended|
  - id: 11. All inputs - Combination therapy 6 cycles - IA-C, not dissected
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0014|Undifferentiated / carcinosarcoma|
        gt0004|FIGO stage: local::at0017|IA-C|
        gt0005|Lymph node dissection status: local::at0021|Lymph node dissection not performed|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0025|Carboplatin (AUC 5) plus
          paclitaxel (175 mg/m²), every 3 weeks for 6 cycles|
  - id: 12. All inputs - Combination therapy 4 cycles - IA-C, not dissected
    input:
      "1":
        gt0003|Histology / differentiation grade: local::at0011|Clear cell|
        gt0004|FIGO stage: local::at0017|IA-C|
        gt0005|Lymph node dissection status: local::at0021|Lymph node dissection not performed|
    expected_output:
      "1":
        gt0007|Primary adjuvant treatment: local::at0026|Carboplatin (AUC 5) plus
          paclitaxel (175 mg/m²), every 3 weeks for 4 cycles|
