guidelines:
  "1": tnm_liver_hcc.v0.1.0
test_cases:
  - id: 1. No input (negative test, default action)
    input:
      "1": {}
    expected_output:
      "1":
        gt0026|Stage group: local::at0012|Stage cannot be assigned|
  - id: 2. T - Primary tumour input missing (negative test, default action)
    input:
      "1":
        gt0036|N - Regional lymph nodes: local::at0029|N1 - Regional lymph node metastasis present|
        gt0037|M - Distant metastasis: local::at0031|M0 - No distant metastasis|
    expected_output:
      "1":
        gt0026|Stage group: local::at0012|Stage cannot be assigned|
  - id: 3. N - Regional lymph nodes input missing (negative test, default action)
    input:
      "1":
        gt0035|T - Primary tumour: local::at0021|T1a - Solitary tumour ≤ 2 cm, with or
          without vascular invasion|
        gt0037|M - Distant metastasis: local::at0031|M0 - No distant metastasis|
    expected_output:
      "1":
        gt0026|Stage group: local::at0012|Stage cannot be assigned|
  - id: 4. M - Distant metastasis input missing (negative test, default action)
